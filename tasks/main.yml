# SPDX-License-Identifier: MIT-0
---
- name: Create vector system group
  ansible.builtin.group:
    name: "{{ vector_group }}"
    system: true
  tags:
    - packages

- name: Create vector system user
  ansible.builtin.user:
    name: "{{ vector_user }}"
    group: "{{ vector_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ vector_data_dir }}"
    create_home: false
  tags:
    - packages

- name: Create vector directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0755"
  loop:
    - "{{ vector_install_dir }}"
    - "{{ vector_config_dir }}"
    - "{{ vector_data_dir }}"
  tags:
    - deploy

- name: Download vector archive
  ansible.builtin.get_url:
    url: "{{ vector_download_url }}"
    dest: "{{ vector_archive_path }}"
    mode: "0644"
  tags:
    - deploy

- name: Extract vector binary
  ansible.builtin.unarchive:
    src: "{{ vector_archive_path }}"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ vector_binary_path }}"
  tags:
    - deploy

- name: Fix ownership of vector install directory
  ansible.builtin.file:
    path: "{{ vector_install_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    recurse: true
  tags:
    - deploy

- name: Deploy vector pipeline configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_path }}"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0640"
  notify: Restart vector
  tags:
    - config

- name: Deploy vector systemd unit
  ansible.builtin.template:
    src: vector.service.j2
    dest: "{{ vector_systemd_unit_path }}"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vector
  tags:
    - systemd

- name: Ensure vector is started and enabled
  ansible.builtin.systemd:
    name: vector
    state: started
    enabled: true
  tags:
    - systemd
